services:
  gazebo:
    build:
      context: .
      dockerfile: Dockerfile
    image: alohamini1-gazebo:jazzy
    ports:
      - "127.0.0.1:6080:6080"
    environment:
      VNC_RESOLUTION: "${VNC_RESOLUTION:-1600x900x24}"
      LIBGL_ALWAYS_SOFTWARE: "1"
    shm_size: "1gb"

  gazebo-headless:
    build:
      context: .
      dockerfile: Dockerfile
    image: alohamini1-gazebo:jazzy
    command: ["ros2", "launch", "aloha", "gazebo.launch.py", "gui:=false"]
    environment:
      LIBGL_ALWAYS_SOFTWARE: "1"
    profiles: ["headless"]
