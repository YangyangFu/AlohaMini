services:
  gazebo:
    build:
      context: .
      dockerfile: Dockerfile
    image: alohamini1-gazebo:jazzy
    ports:
      - "127.0.0.1:6080:6080"
    environment:
      VNC_RESOLUTION: "${VNC_RESOLUTION:-1920x1080x24}"
      VNC_USER: "${VNC_USER:-kasm}"
      VNC_PW: "${VNC_PW:-password}"
      LIBGL_ALWAYS_SOFTWARE: "1"
    shm_size: "8gb"

  # Renders into a native window on the host X server instead of the browser.
  # macOS: install XQuartz, enable "Allow connections from network clients",
  # run `xhost + 127.0.0.1`, then `docker compose --profile x11 up --build gazebo-x11`.
  # See the README "X11 Native Window" section for full setup and Linux notes.
  gazebo-x11:
    build:
      context: .
      dockerfile: Dockerfile.x11
    image: alohamini1-gazebo-x11:jazzy
    environment:
      # macOS/Windows reach the host X server over TCP via host.docker.internal.
      # macOS defaults to the TCP X server address; Linux inherits the host
      # DISPLAY and uses the X socket mounted below.
      DISPLAY: "${DISPLAY:-host.docker.internal:0}"
      # Software OpenGL avoids XQuartz indirect-GLX failures with modern Gazebo.
      LIBGL_ALWAYS_SOFTWARE: "${LIBGL_ALWAYS_SOFTWARE:-1}"
    volumes:
      # Used by Linux hosts; harmless when the service uses a TCP X server.
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    shm_size: "8gb"
    profiles: ["x11"]

  gazebo-headless:
    build:
      context: .
      dockerfile: Dockerfile
    image: alohamini1-gazebo:jazzy
    command: ["ros2", "launch", "aloha", "gazebo.launch.py", "gui:=false"]
    environment:
      LIBGL_ALWAYS_SOFTWARE: "1"
    profiles: ["headless"]
