# ros2_control configuration for AlohaMini1 in Gazebo (gz_ros2_control).
#
# The controller_manager is hosted inside the Gazebo process by the
# gz_ros2_control-system plugin composed by urdf/aloha_sim.urdf.xacro. The
# launch file spawns each controller listed here.
#
#   joint_state_broadcaster   publishes /joint_states for all joints
#   omni_base_controller maps body velocity commands to the three omni wheels
#                        and publishes wheel odometry
#   left_arm_controller       5-DOF left arm  (position trajectory)
#   right_arm_controller      5-DOF right arm (position trajectory)
#   left_gripper_controller   left moving jaw (position action)
#   right_gripper_controller  right moving jaw (position action)
#   lift_controller           prismatic vertical lift (effort PID trajectory)
#
controller_manager:
  ros__parameters:
    update_rate: 100  # Hz
    use_sim_time: true

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    omni_base_controller:
      type: omni_wheel_drive_controller/OmniWheelDriveController

    left_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    right_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    left_gripper_controller:
      type: parallel_gripper_action_controller/GripperActionController

    right_gripper_controller:
      type: parallel_gripper_action_controller/GripperActionController

    lift_controller:
      type: joint_trajectory_controller/JointTrajectoryController

omni_base_controller:
  ros__parameters:
    # Counter-clockwise wheel order in the ROS-aligned base_link frame. The
    # CAD chassis is rotated +pi/2 because its -Y axis is the robot's front,
    # so the former +0.51459 rad offset becomes +2.08538632679 rad.
    wheel_names:
      - wheel2_joint
      - wheel1_joint
      - wheel3_joint
    wheel_offset: 2.08538632679
    robot_radius: 0.17878
    wheel_radius: 0.0495
    open_loop: false
    position_feedback: true
    enable_odom_tf: true
    odom_frame_id: odom
    base_frame_id: base_link
    tf_frame_prefix_enable: false
    cmd_vel_timeout: 0.5
    diagonal_covariance:
      pose: [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]
      twist: [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]

left_arm_controller:
  ros__parameters:
    joints:
      - left_joint1
      - left_joint2
      - left_joint3
      - left_joint4
      - left_joint5
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity

right_arm_controller:
  ros__parameters:
    joints:
      - right_joint1
      - right_joint2
      - right_joint3
      - right_joint4
      - right_joint5
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity

# The CAD export calls the moving jaws left_joint6 and right_joint6. Keep those
# joint names until the physical bus/interface contract is frozen, but expose
# them through semantic gripper action controllers instead of arm trajectories.
# Endpoint, tolerance, velocity, effort, and stall calibration remain future
# hardware work; the controller package defaults are used for now.
left_gripper_controller:
  ros__parameters:
    joint: left_joint6

right_gripper_controller:
  ros__parameters:
    joint: right_joint6

lift_controller:
  ros__parameters:
    joints:
      - vertical_move
    command_interfaces:
      - effort
    state_interfaces:
      - position
      - velocity
    # DART's velocity-backed position interface can become pinned at a hard
    # prismatic limit on this gravity-loaded assembly. Use a bounded effort PID
    # so the simulated actuator can raise and hold the 2.76 kg moving subtree.
    # These gains are simulation parameters, not physical motor calibration.
    gains:
      vertical_move:
        p: 3000.0
        i: 500.0
        d: 200.0
        i_clamp_max: 50.0
        i_clamp_min: -50.0
        u_clamp_max: 100.0
        u_clamp_min: -100.0
