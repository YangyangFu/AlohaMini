# ros2_control configuration for AlohaMini1 in Gazebo (gz_ros2_control).
#
# The controller_manager is hosted inside the Gazebo process by the
# gz_ros2_control-system plugin composed by urdf/aloha_sim.urdf.xacro. The
# launch file spawns each controller listed here.
#
#   joint_state_broadcaster   publishes /joint_states for all joints
#   omni_base_controller maps body velocity commands to the three omni wheels
#                        and publishes wheel odometry
#   left_arm_controller       6-DOF left arm  (position trajectory)
#   right_arm_controller      6-DOF right arm (position trajectory)
#   lift_controller           prismatic vertical lift (position)
#
controller_manager:
  ros__parameters:
    update_rate: 100  # Hz
    use_sim_time: true

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    omni_base_controller:
      type: omni_wheel_drive_controller/OmniWheelDriveController

    left_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    right_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    lift_controller:
      type: joint_trajectory_controller/JointTrajectoryController

omni_base_controller:
  ros__parameters:
    # The controller requires counter-clockwise order. wheel2 is the first
    # wheel at +0.51459 rad from base_link +X, followed by wheel1 and wheel3.
    wheel_names:
      - wheel2_joint
      - wheel1_joint
      - wheel3_joint
    wheel_offset: 0.51459
    robot_radius: 0.17878
    wheel_radius: 0.0495
    open_loop: false
    position_feedback: true
    enable_odom_tf: true
    odom_frame_id: odom
    base_frame_id: base_link
    tf_frame_prefix_enable: false
    cmd_vel_timeout: 0.5
    diagonal_covariance:
      pose: [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]
      twist: [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]

left_arm_controller:
  ros__parameters:
    joints:
      - left_joint1
      - left_joint2
      - left_joint3
      - left_joint4
      - left_joint5
      - left_joint6
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity

right_arm_controller:
  ros__parameters:
    joints:
      - right_joint1
      - right_joint2
      - right_joint3
      - right_joint4
      - right_joint5
      - right_joint6
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity

lift_controller:
  ros__parameters:
    joints:
      - vertical_move
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
